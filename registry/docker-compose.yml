version: '3.8'

services:
  verdaccio:
    image: verdaccio/verdaccio:5
    container_name: lab-verdaccio-registry
    ports:
      - "4873:4873"
    volumes:
      - ./storage:/verdaccio/storage
      - ./config:/verdaccio/conf
      - ./plugins:/verdaccio/plugins
    environment:
      - VERDACCIO_PORT=4873
      - VERDACCIO_PROTOCOL=http
    restart: unless-stopped
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge

volumes:
  verdaccio-storage:
  verdaccio-config:
